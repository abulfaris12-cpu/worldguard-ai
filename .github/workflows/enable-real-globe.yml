name: Enable real rotatable globe

on:
  push:
    paths:
      - '.github/workflows/enable-real-globe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-globe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace fallback with real interactive globe
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('dashboard-v2.html')
          s = p.read_text(encoding='utf-8')

          # The current page already contains the globe.gl implementation and exact
          # latitude/longitude signal data. Make that canvas the visible globe and
          # hide only the temporary CSS fallback layer.
          s = s.replace(
              '<div id="globe" class="globeCanvas" style="display:none"></div>',
              '<div id="globe" class="globeCanvas"></div>'
          )
          s = s.replace(
              '.fallback-globe{position:absolute;inset:0;z-index:2;',
              '.fallback-globe{display:none!important;position:absolute;inset:0;z-index:2;'
          )

          # Keep the real globe below HUD overlays but above the panel background.
          marker = '.globeCanvas{position:absolute;inset:0}'
          if marker in s and '.globeCanvas{position:absolute;inset:0;z-index:1}' not in s:
              s = s.replace(marker, '.globeCanvas{position:absolute;inset:0;z-index:1}', 1)

          # Add a stronger, reliable Globe.gl canvas sizing rule.
          css = '''\n/* REAL INTERACTIVE GLOBE */\n#globe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}\n#globe canvas{display:block!important;width:100%!important;height:100%!important;touch-action:none!important;cursor:grab}\n#globe canvas:active{cursor:grabbing}\n'''
          if '/* REAL INTERACTIVE GLOBE */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          # Replace the signal definition with a richer set of precisely geocoded demo points.
          new_signals = "const signals=[{name:'Paris',lat:48.8566,lng:2.3522,c:'#ff405d',size:.62},{name:'London',lat:51.5074,lng:-.1278,c:'#ffb52e',size:.52},{name:'Kyiv',lat:50.4501,lng:30.5234,c:'#ff405d',size:.66},{name:'Tokyo',lat:35.6762,lng:139.6503,c:'#ff405d',size:.62},{name:'Mumbai',lat:19.076,lng:72.8777,c:'#ffb52e',size:.55},{name:'Singapore',lat:1.3521,lng:103.8198,c:'#00e89a',size:.46},{name:'New York',lat:40.7128,lng:-74.006,c:'#27d9ff',size:.48},{name:'San Francisco',lat:37.7749,lng:-122.4194,c:'#27d9ff',size:.45},{name:'Dubai',lat:25.2048,lng:55.2708,c:'#ffb52e',size:.5},{name:'Taipei',lat:25.033,lng:121.5654,c:'#ff405d',size:.58},{name:'Jakarta',lat:-6.2088,lng:106.8456,c:'#ffb52e',size:.5},{name:'São Paulo',lat:-23.5505,lng:-46.6333,c:'#ff405d',size:.58},{name:'Cairo',lat:30.0444,lng:31.2357,c:'#ffb52e',size:.48},{name:'Sydney',lat:-33.8688,lng:151.2093,c:'#00e89a',size:.43}];"
          s = re.sub(r"const signals=\[.*?\];const arcs=", new_signals + "const arcs=", s, count=1, flags=re.S)

          # Make points clickable and show their real coordinates/name.
          s = s.replace(
              ".pointsMerge(false).labelsData(regions)",
              ".pointsMerge(false).pointLabel(d=>`<b>${d.name}</b><br>LAT ${d.lat.toFixed(4)} · LON ${d.lng.toFixed(4)}`).labelsData(regions)"
          )

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-v2.html
          git diff --cached --quiet || git commit -m 'Restore real rotatable globe and exact location pins'
          git push

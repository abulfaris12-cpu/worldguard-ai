name: Render real country globe

on:
  push:
    paths:
      - '.github/workflows/real-country-globe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add real country geometry
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('dashboard-v2.html')
          s=p.read_text(encoding='utf-8')

          # Use the actual Natural Earth country dataset shipped with three-globe.
          # The previous URL pointed to a non-existent country-polygons path.
          old="https://cdn.jsdelivr.net/npm/three-globe/example/country-polygons/ne_110m_admin_0_countries.geojson"
          new="https://cdn.jsdelivr.net/npm/three-globe/example/datasets/ne_110m_admin_0_countries.geojson"
          s=s.replace(old,new)

          s=re.sub(
            r"\.globeImageUrl\('https://unpkg\.com/three-globe/example/img/earth-blue-marble\.jpg'\)\.bumpImageUrl\('https://unpkg\.com/three-globe/example/img/earth-topology\.png'\)",
            ".showGlobe(true).showGraticules(true)",
            s,
            count=1
          )

          marker="globe.controls().autoRotate=true;"
          block="""/* WORLDGUARD_REAL_COUNTRIES */
fetch('https://cdn.jsdelivr.net/npm/three-globe/example/datasets/ne_110m_admin_0_countries.geojson')
  .then(r=>{
    if(!r.ok) throw new Error('GeoJSON HTTP '+r.status);
    return r.json();
  })
  .then(world=>{
    const countries=(world.features||[]).filter(f=>f.properties && f.properties.ISO_A2!=='AQ');
    globe
      .polygonsData(countries)
      .polygonGeoJsonGeometry('geometry')
      .polygonAltitude(0.008)
      .polygonCapColor(()=> 'rgba(18,92,116,0.96)')
      .polygonSideColor(()=> 'rgba(4,28,40,0.85)')
      .polygonStrokeColor(()=> 'rgba(80,205,235,0.58)')
      .polygonLabel(({properties:d})=> `<b>${d.ADMIN||'Country'}</b><br>ISO: ${d.ISO_A2||'--'}`)
      .polygonsTransitionDuration(500);
  })
  .catch(err=>console.warn('World country geometry failed to load:',err));
"""
          if "WORLDGUARD_REAL_COUNTRIES" not in s:
            s=s.replace(marker,block+marker,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit dashboard patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-v2.html
          git diff --cached --quiet || git commit -m 'Render real country boundaries on globe'
          git push

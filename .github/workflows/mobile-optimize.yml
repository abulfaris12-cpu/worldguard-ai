name: Apply dashboard layout optimization

on:
  push:
    paths:
      - '.github/workflows/mobile-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact dashboard CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* WORLDGUARD COMPACT MAP */'
          if marker not in s:
              css = r'''/* WORLDGUARD COMPACT MAP */
          @media (min-width:801px){
            .layout{grid-template-rows:420px minmax(245px,1fr)}
            .maparea,.map{height:420px}
            .bottom{min-height:245px}
          }
          @media (max-width:800px){
            .maparea,.map{height:285px;min-height:285px}
            .layout{display:flex;flex-direction:column}
          }
          @media (max-width:480px){
            .maparea,.map{height:240px;min-height:240px}
          }
          '''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit optimized layout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact map and rebalance dashboard layout'
          git push

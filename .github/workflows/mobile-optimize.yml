name: Apply mobile dashboard optimization

on:
  push:
    paths:
      - '.github/workflows/mobile-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* WORLDGUARD MOBILE OPTIMIZATION */'
          if marker not in s:
              css = r'''/* WORLDGUARD MOBILE OPTIMIZATION */
@media (max-width:800px){
  html,body{overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%}
  .app{height:auto;min-height:100vh;display:grid;grid-template-rows:48px 38px auto 25px}
  .top{height:48px;padding:0 8px;gap:7px;position:sticky;top:0;z-index:900}
  .brand{font-size:13px;letter-spacing:1.2px}
  .brand span{display:none}
  .nav{display:none}
  .live{font-size:8px;padding:5px 6px;white-space:nowrap}
  .search{display:block;width:120px;min-width:0;padding:7px 7px;font-size:10px}
  .ico{width:30px;height:30px;flex:none}
  .sub{height:38px;padding:0 6px;gap:2px;position:sticky;top:48px;z-index:899;white-space:nowrap}
  .sub button{padding:8px 9px;font-size:9px;flex:none}
  .layout{display:flex;flex-direction:column;min-height:0}
  .maparea{order:1;height:320px;min-height:320px;flex:none}
  .map{height:320px}
  .hud{top:7px;left:7px;gap:3px}
  .hud span{padding:4px 5px;font-size:8px}
  .title{top:7px;font-size:9px;padding:4px 6px;white-space:nowrap}
  .mapcard{left:7px;bottom:7px;min-width:0;padding:6px 7px}
  .mapcard b{font-size:8px;margin-bottom:4px}
  .legend{gap:6px;font-size:8px;flex-wrap:wrap}
  .mapstats{right:7px;bottom:7px;padding:5px 6px;font-size:8px}
  .left{order:2;border-right:0;border-top:1px solid var(--line);max-height:255px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;align-content:start}
  .left .heading{grid-column:1/-1}
  .left .item{padding:9px 8px;font-size:10px;min-height:36px}
  .left .scope{margin:6px;grid-column:span 1}
  .right{order:3;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .rightbody{padding:8px}
  .card{margin-bottom:8px}
  .chead{padding:9px 8px;font-size:9px}
  .body{padding:10px}
  .event{padding:9px 8px}
  .bottom{order:4;grid-column:auto;display:grid;grid-template-columns:1fr;background:#080b0e;border-top:1px solid var(--line)}
  .bottom>section{border-right:0;border-bottom:1px solid var(--line);min-height:0}
  .bottom .heading{padding:9px 10px}
  .list{padding:7px 9px}
  .news{padding:8px 6px}
  .chart{height:145px;padding:10px}
  .bars{height:95px;gap:6px}
  .status{min-height:25px;gap:8px;overflow:hidden;white-space:nowrap;font-size:7px}
  .status span:nth-child(2),.status span:nth-child(3){display:none}
}
@media (max-width:480px){
  .top{gap:5px}
  .brand{font-size:12px}
  .search{width:105px}
  .ico{width:28px;height:28px}
  .maparea,.map{height:285px;min-height:285px}
  .title{display:none}
  .hud span:nth-child(2){display:none}
  .mapcard{max-width:58%}
  .mapstats{font-size:7px}
  .left{max-height:230px}
  .left .item{font-size:9px;padding:8px 6px}
  .ring{width:60px;height:60px}
  .ring:after{width:45px;height:45px}
}
'''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Optimize dashboard layout for mobile'
          git push

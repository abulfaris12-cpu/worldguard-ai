name: Apply dashboard layout optimization

on:
  push:
    paths:
      - '.github/workflows/mobile-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force compact map dimensions
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.layout{grid-template-rows:420px minmax(245px,1fr)}', '.layout{grid-template-rows:320px minmax(300px,1fr)}')
          s = s.replace('.maparea,.map{height:420px}', '.maparea,.map{height:320px}')
          s = s.replace('.bottom{min-height:245px}', '.bottom{min-height:300px}')
          s = s.replace('.maparea,.map{height:285px;min-height:285px}', '.maparea,.map{height:240px;min-height:240px}')
          s = s.replace('.maparea,.map{height:240px;min-height:240px}', '.maparea,.map{height:210px;min-height:210px}')
          p.write_text(s, encoding='utf-8')
      - name: Commit optimized layout
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Reduce map height for compact dashboard'
          git push

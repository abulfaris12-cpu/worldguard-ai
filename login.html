<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldGuard AI — Analyst Access</title><style>:root{--bg:#07090b;--p:#0d1217;--line:#283139;--text:#e8edf1;--muted:#82909b;--g:#42e69a;--c:#45d6ff;--r:#ff5367}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#101b23,#07090b 55%);color:var(--text);font:13px Segoe UI,Arial,sans-serif;display:grid;place-items:center}.box{width:min(440px,92vw);background:var(--p);border:1px solid var(--line);box-shadow:0 24px 90px #000;padding:24px}.brand{font-weight:900;letter-spacing:2px;font-size:18px}.sub{color:var(--muted);font-size:10px;letter-spacing:1px;margin-top:5px}.pill{display:inline-block;margin-top:18px;color:var(--g);border:1px solid #24543f;background:#0c1b15;padding:5px 8px;font-size:9px}.label{color:#7c8994;text-transform:uppercase;font-size:9px;letter-spacing:1.2px;margin-top:20px}.select,.btn{width:100%;padding:10px;margin-top:7px;background:#080c10;color:#dfe5e9;border:1px solid #303a42;border-radius:3px}.btn{cursor:pointer}.btn.primary{background:#12452f;border-color:#246e4d;color:#79efb7;font-weight:700}.roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.role{padding:8px;border:1px solid #283139;background:#10161c;text-align:center;color:#aab4bc;cursor:pointer;font-size:10px}.role.active{border-color:#2e7657;color:var(--g);background:#0d1b16}.info{margin-top:16px;padding:10px;background:#090d11;border:1px solid #252e36;color:#74818b;font-size:10px;line-height:1.6}.foot{margin-top:15px;color:#59656e;font-size:9px}</style></head><body><main class="box"><div class="brand">WORLDGUARD AI</div><div class="sub">SECURITY INTELLIGENCE TERMINAL · SIH26163</div><div class="pill">● DEMO AUTHENTICATION</div><div class="label">Select demo role</div><div class="roles"><div class="role active" data-role="Analyst">ANALYST</div><div class="role" data-role="Reviewer">REVIEWER</div><div class="role" data-role="Administrator">ADMIN</div></div><button class="btn primary" onclick="enterLab()">Enter Security Console</button><div id="info" class="info">Analyst: run assessments, inspect findings and validate controlled PoCs.</div><div class="foot">Synthetic accounts only · No real credentials · No production access</div></main><script>const roles={Analyst:'Analyst: run assessments, inspect findings and validate controlled PoCs.',Reviewer:'Reviewer: inspect evidence, reports and remediation status.',Administrator:'Administrator: demo-only configuration and role management.'};let role='Analyst';document.querySelectorAll('.role').forEach(x=>x.onclick=()=>{document.querySelectorAll('.role').forEach(y=>y.classList.remove('active'));x.classList.add('active');role=x.dataset.role;document.getElementById('info').textContent=roles[role]});function enterLab(){localStorage.setItem('wg_role',role);localStorage.setItem('wg_demo_auth','true');location.href='index.html'}</script></body></html>
